name: Archive H3 gradient publication data

on:
  push:
    branches: [agent/archive-h3-gradient-publication]
    paths:
      - ".github/workflows/archive-h3-gradient-publication.yml"

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/archive-h3-gradient-publication
          fetch-depth: 0
      - name: Download authoritative gradient publication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/h3_fragmentation_gradient
          gh run download 31937210601 \
            -n h3-fragmentation-gradient-publication \
            -D artifacts/h3_fragmentation_gradient
      - name: Verify source artifact contents and checksum manifest
        run: |
          cd artifacts/h3_fragmentation_gradient
          sha256sum -c MANIFEST.sha256
          test "$(($(wc -l < h3_fragmentation_gradient_records.csv)-1))" -eq 9600
          test "$(($(wc -l < h3_fragmentation_gradient_cell_summary.csv)-1))" -eq 96
          test "$(($(wc -l < h3_fragmentation_gradient_pooled_summary.csv)-1))" -eq 8
          grep -q '1200' h3_fragmentation_gradient_metadata.json
          grep -q 'Fixed-area fragmentation gradient from paired H1-prepared sources' figure_s_fragmentation_gradient.svg
      - name: Commit versioned publication data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/h3_fragmentation_gradient
          git commit -m 'Archive H3 fragmentation-gradient publication data'
          git push origin HEAD:agent/archive-h3-gradient-publication
