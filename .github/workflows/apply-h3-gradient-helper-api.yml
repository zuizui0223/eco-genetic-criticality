name: Apply H3 gradient helper API patch

on:
  push:
    branches: [agent/h3-fragmentation-gradient-sensitivity]
    paths:
      - "scripts/patch_h3_gradient_helper_api.py"
      - ".github/workflows/apply-h3-gradient-helper-api.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h3-fragmentation-gradient-sensitivity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply compatibility patch
        run: python scripts/patch_h3_gradient_helper_api.py
      - name: Verify helper and gradient contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_mutation_primary_h1_h2_h3_chain.py tests/test_h3_fragmentation_gradient_sensitivity.py
          python -m py_compile causal_model/mutation_primary_h1_h2_h3_chain.py
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add causal_model/mutation_primary_h1_h2_h3_chain.py .github/workflows/h3-fragmentation-gradient-sensitivity.yml
          if git diff --cached --quiet; then
            echo 'No compatibility changes needed.'
          else
            git commit -m 'Fix primary helper canonical API compatibility'
            git push origin HEAD:agent/h3-fragmentation-gradient-sensitivity
          fi
