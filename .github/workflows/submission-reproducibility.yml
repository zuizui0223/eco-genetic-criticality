name: Submission reproducibility

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "REPRODUCIBILITY.md"
      - "pyproject.toml"
      - "causal_model/**"
      - "docs/final_evidence_ledger.md"
      - "manuscript/**"
      - "reproducibility/**"
      - "scripts/verify_release_contract.py"
      - ".github/workflows/submission-reproducibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "REPRODUCIBILITY.md"
      - "pyproject.toml"
      - "causal_model/**"
      - "docs/final_evidence_ledger.md"
      - "manuscript/**"
      - "reproducibility/**"
      - "scripts/verify_release_contract.py"
      - ".github/workflows/submission-reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Run tests
        run: python -m pytest

      - name: Verify canonical scientific contract
        run: python scripts/verify_release_contract.py

      - name: Build wheel, source distribution, and canonical source archive
        run: |
          python -m build --outdir dist
          git archive \
            --format=tar.gz \
            --output=dist/eco-genetic-criticality-scientific-dd8ee379.tar.gz \
            dd8ee379d0d3518194c767d16402042525bc00dc

      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv .wheel-test
          . .wheel-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import causal_model; print(causal_model.__name__)"

      - name: Assemble parent release bundle
        run: |
          mkdir -p parent_release_bundle/software
          cp dist/* parent_release_bundle/software/
          cp README.md REPRODUCIBILITY.md pyproject.toml parent_release_bundle/
          cp reproducibility/release_manifest.json parent_release_bundle/
          mkdir -p parent_release_bundle/evidence parent_release_bundle/manuscript
          cp docs/final_evidence_ledger.md parent_release_bundle/evidence/
          cp docs/eco_genetic_hypothesis_program.md parent_release_bundle/evidence/
          cp manuscript/claim_evidence_map.md parent_release_bundle/manuscript/
          cp manuscript/supplementary_mathematical_results.md parent_release_bundle/manuscript/
          find parent_release_bundle -type f ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > parent_release_bundle/MANIFEST.sha256

      - name: Upload parent release bundle
        uses: actions/upload-artifact@v4
        with:
          name: eco-genetic-criticality-release-bundle
          path: parent_release_bundle
          if-no-files-found: error
